name: Build and Publish to NuGet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: "Publish to NuGet?"
        required: true
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        
      - uses: actions/checkout@v7
        with:
          repository: penyland/infinity-toolkit
          ref: main
          path: infinity-toolkit
      
      - name: Setup .NET 11
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/Infinity.Toolkit.Messaging.Tests/Infinity.Toolkit.Messaging.Tests.csproj --configuration Release --no-build -- --disable-logo

      - name: Pack
        run: dotnet pack --configuration Release --output ./nupkgs -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Publish
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          if-no-files-found: error
          retention-days: 7
          path: |
            ./nupkgs/*.nupkg
            ./nupkgs/*.snupkg

  publish-nuget:
    needs: build-and-test
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_to_nuget == 'true')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./nupkgs

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: NuGet login (OIDC)
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push **/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push **/*.snupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json --skip-duplicate
